appId: dev.wangxu.ksuApp
productName: Ksu-App

directories:
  output: release

files:
  - dist/**
  - electron/**
  - package.json

extraMetadata:
  main: electron/main.cjs

asar: true

mac:
  icon: build/icons/icon.icns
  target:
    - dmg
    - zip

win:
  icon: build/icons/icon.ico
  target:
    - nsis
    - zip

linux:
  icon: build/icons/png
  target:
    - AppImage
    - tar.gz
