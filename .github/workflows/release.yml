name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
            artifact_name: linux
          - os: windows-latest
            platform: --win
            artifact_name: windows
          - os: macos-latest
            platform: --mac
            artifact_name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check icon files
        run: |
          node -e "const fs=require('fs'); const req=['build/icons/icon.icns','build/icons/icon.ico','build/icons/icon.png']; const miss=req.filter(p=>!fs.existsSync(p)); if(miss.length){console.error('Missing icon files:', miss.join(', ')); process.exit(1);} console.log('Icon files OK');"

      - name: Build frontend assets
        run: npm run build

      - name: Package Electron app
        run: npx electron-builder@latest --config electron-builder.yml ${{ matrix.platform }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const currentTag = context.ref.replace('refs/tags/', '');
            const changelogPath = 'CHANGELOG.md';

            function extractFromChangelog(tagName) {
              if (!fs.existsSync(changelogPath)) return null;
              const content = fs.readFileSync(changelogPath, 'utf8');
              const escaped = tagName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const escapedNoV = tagName.replace(/^v/, '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(
                `^##\\s*\\[?(?:${escaped}|${escapedNoV})\\]?[^\\n]*\\n([\\s\\S]*?)(?=^##\\s|\\Z)`,
                'm',
              );
              const match = content.match(regex);
              if (!match) return null;
              const notes = match[1].trim();
              return notes.length > 0 ? notes : null;
            }

            const changelogNotes = extractFromChangelog(currentTag);
            if (!changelogNotes) {
              core.setFailed(
                `Missing release notes in CHANGELOG.md for ${currentTag}. Please add a section like '## ${currentTag}' or '## ${currentTag.replace(/^v/, '')}'.`,
              );
              return;
            }

            const body = [`## ${currentTag}`, '', changelogNotes, '', 'Artifacts: Windows / macOS / Linux'].join('\n');
            core.setOutput('body', body);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.yml
            artifacts/*.blockmap
          draft: false
          prerelease: false
