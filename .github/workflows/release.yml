name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: --linux
            artifact_name: linux
          - os: windows-latest
            platform: --win
            artifact_name: windows
          - os: macos-latest
            platform: --mac
            artifact_name: macos
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-cache-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-cache-

      - name: Check icon files
        run: |
          node -e "const fs=require('fs'); const req=['build/icons/icon.icns','build/icons/icon.ico','build/icons/icon.png']; const miss=req.filter(p=>!fs.existsSync(p)); if(miss.length){console.error('Missing icon files:', miss.join(', ')); process.exit(1);} console.log('Icon files OK');"

      - name: Build app assets
        run: npm run electron:build

      - name: Package Electron app (with retry)
        shell: bash
        run: |
          set -euo pipefail
          ATTEMPTS=3
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "Packaging attempt $i/$ATTEMPTS"
            if npx electron-builder --config electron-builder.yml ${{ matrix.platform }} --publish never; then
              echo "Packaging succeeded on attempt $i"
              exit 0
            fi
            if [ "$i" -lt "$ATTEMPTS" ]; then
              SLEEP_SEC=$((i * 10))
              echo "Packaging failed, retrying in ${SLEEP_SEC}s..."
              sleep "$SLEEP_SEC"
            fi
          done
          echo "Packaging failed after ${ATTEMPTS} attempts"
          exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const currentTag = context.ref.replace('refs/tags/', '');
            const changelogPath = 'CHANGELOG.md';

            function extractFromChangelog(tagName) {
              if (!fs.existsSync(changelogPath)) return null;
              const content = fs.readFileSync(changelogPath, 'utf8');
              const tagNoV = tagName.replace(/^v/, '');
              const sectionRegex = /^##\s+(.+)$/gm;
              const sections = [];
              let match;
              while ((match = sectionRegex.exec(content)) !== null) {
                sections.push({ title: match[1].trim(), index: match.index, end: sectionRegex.lastIndex });
              }
              for (let i = 0; i < sections.length; i += 1) {
                const s = sections[i];
                const title = s.title.replace(/^\[|\]$/g, '');
                const isTarget = title.startsWith(tagName) || title.startsWith(tagNoV);
                if (!isTarget) continue;
                const bodyStart = s.end;
                const bodyEnd = i + 1 < sections.length ? sections[i + 1].index : content.length;
                const notes = content.slice(bodyStart, bodyEnd).trim();
                return notes.length > 0 ? notes : null;
              }
              return null;
            }

            const changelogNotes = extractFromChangelog(currentTag);
            if (!changelogNotes) {
              core.setFailed(
                `Missing release notes in CHANGELOG.md for ${currentTag}. Please add a section like '## ${currentTag}' or '## ${currentTag.replace(/^v/, '')}'.`,
              );
              return;
            }

            const body = [`## ${currentTag}`, '', changelogNotes, '', 'Artifacts: Windows / macOS / Linux'].join('\n');
            core.setOutput('body', body);

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ksu-App ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.yml
            artifacts/*.blockmap
          draft: false
          prerelease: false
